name: Publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_code_revision:
        description: Optional application revision that must be deployed
        required: false
        type: string
      expected_data_revision:
        description: Optional data revision that must be deployed
        required: false
        type: string
  workflow_call:
    inputs:
      expected_code_revision:
        description: Optional application revision that must be deployed
        required: false
        type: string
      expected_data_revision:
        description: Optional data revision that must be deployed
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      code_revision: ${{ steps.revisions.outputs.code_revision }}
      data_revision: ${{ steps.revisions.outputs.data_revision }}
    steps:
      - name: Check out latest application code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Check out latest validated data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data-source
          fetch-depth: 2

      - name: Resolve tested revisions
        id: revisions
        env:
          EXPECTED_CODE_REVISION: ${{ inputs.expected_code_revision }}
          EXPECTED_DATA_REVISION: ${{ inputs.expected_data_revision }}
        run: |
          set -euo pipefail
          code_revision="$(git rev-parse HEAD)"
          data_revision="$(git -C data-source rev-parse HEAD)"
          if [[ -n "$EXPECTED_CODE_REVISION" && -z "$EXPECTED_DATA_REVISION" ]] ||
            [[ -z "$EXPECTED_CODE_REVISION" && -n "$EXPECTED_DATA_REVISION" ]]; then
            echo "Expected code and data revisions must be provided together." >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_CODE_REVISION" && "$code_revision" != "$EXPECTED_CODE_REVISION" ]]; then
            echo "Expected code $EXPECTED_CODE_REVISION but resolved $code_revision" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_DATA_REVISION" && "$data_revision" != "$EXPECTED_DATA_REVISION" ]]; then
            echo "Expected data $EXPECTED_DATA_REVISION but resolved $data_revision" >&2
            exit 1
          fi
          echo "code_revision=$code_revision" >> "$GITHUB_OUTPUT"
          echo "data_revision=$data_revision" >> "$GITHUB_OUTPUT"

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact data lineage
        run: npm run verify:data-lineage -- data-source

      - name: Prepare verified snapshot
        run: |
          mkdir -p data
          cp data-source/snapshot.json data/snapshot.json
          cp data-source/receipt.json data/receipt.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete release gate
        env:
          CODE_REVISION: ${{ steps.revisions.outputs.code_revision }}
          DATA_REVISION: ${{ steps.revisions.outputs.data_revision }}
        run: |
          npm run lint
          npm test
          npm run build
          npm run test:e2e

      - name: Reject a stale queued build
        env:
          TESTED_CODE_REVISION: ${{ steps.revisions.outputs.code_revision }}
          TESTED_DATA_REVISION: ${{ steps.revisions.outputs.data_revision }}
        run: |
          live_code_revision="$(git ls-remote origin refs/heads/main | cut -f1)"
          live_data_revision="$(git ls-remote origin refs/heads/data | cut -f1)"
          test "$live_code_revision" = "$TESTED_CODE_REVISION"
          test "$live_data_revision" = "$TESTED_DATA_REVISION"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the exact tested artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact tested artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
