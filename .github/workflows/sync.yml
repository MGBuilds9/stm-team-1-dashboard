name: Basketball Data Sync

on:
  schedule:
    - cron: "17 7,15,23 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: basketball-data-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.result.outputs.changed }}
      code_revision: ${{ steps.result.outputs.code_revision }}
      content_hash: ${{ steps.result.outputs.content_hash }}
      data_revision: ${{ steps.result.outputs.data_revision }}
      publish_required: ${{ steps.result.outputs.publish_required }}
    steps:
      - name: Check out application code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check out last-known-good data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data-source
          fetch-depth: 2

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify last-known-good data lineage
        run: npm run verify:data-lineage -- data-source

      - name: Restore last-known-good snapshot
        run: |
          mkdir -p data
          cp data-source/snapshot.json data/snapshot.json
          cp data-source/receipt.json data/receipt.json

      - name: Probe and validate configured league
        id: probe
        run: |
          set -o pipefail
          npm run sync | tee sync-output.txt
          if grep -q '^CHANGED ' sync-output.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit one validated snapshot revision
        if: steps.probe.outputs.changed == 'true'
        run: |
          cp data/snapshot.json data-source/snapshot.json
          cp data/receipt.json data-source/receipt.json
          git -C data-source config user.name "basketball-dashboard-bot"
          git -C data-source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data-source add snapshot.json receipt.json
          generated_at="$(node -p "require('./data-source/receipt.json').generatedAt")"
          team_id="$(node -p "require('./data-source/receipt.json').teamId")"
          git -C data-source commit -m "data: refresh team $team_id snapshot $generated_at"

      - name: Verify new data lineage before push
        if: steps.probe.outputs.changed == 'true'
        run: npm run verify:data-lineage -- data-source

      - name: Push verified data revision
        if: steps.probe.outputs.changed == 'true'
        run: git -C data-source push origin HEAD:data

      - name: Reconcile the expected release with live Pages
        id: result
        env:
          CHANGED: ${{ steps.probe.outputs.changed }}
          DASHBOARD_PUBLIC_URL: ${{ vars.DASHBOARD_PUBLIC_URL }}
        run: |
          set -euo pipefail
          code_revision="$(git rev-parse HEAD)"
          data_revision="$(git -C data-source rev-parse HEAD)"
          snapshot_content_hash="$(node -p 'require("./data/snapshot.json").contentHash')"
          repository_name="${GITHUB_REPOSITORY#*/}"
          release_base_url="${DASHBOARD_PUBLIC_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}}"
          release_url="${release_base_url%/}/release.json?expected_data_revision=${data_revision}&run_id=${GITHUB_RUN_ID}&attempt=${GITHUB_RUN_ATTEMPT}"
          live_manifest="$(mktemp)"
          trap 'rm -f "$live_manifest"' EXIT
          live_matches=false

          if curl \
            --fail \
            --silent \
            --show-error \
            --proto '=https' \
            --connect-timeout 5 \
            --max-time 20 \
            --max-filesize 65536 \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache' \
            --output "$live_manifest" \
            "$release_url" &&
            npx --no-install tsx scripts/release-manifest.ts matches \
              "$live_manifest" \
              "$code_revision" \
              "$data_revision" \
              "$snapshot_content_hash"
          then
            live_matches=true
          fi

          if [[ "$CHANGED" == "true" || "$live_matches" != "true" ]]; then
            if [[ "$live_matches" != "true" ]]; then
              echo "Live release is missing or does not match the expected code/data pair."
            fi
            echo "publish_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_required=false" >> "$GITHUB_OUTPUT"
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "code_revision=$code_revision" >> "$GITHUB_OUTPUT"
          echo "content_hash=$snapshot_content_hash" >> "$GITHUB_OUTPUT"
          echo "data_revision=$data_revision" >> "$GITHUB_OUTPUT"

  publish:
    needs: sync
    if: needs.sync.outputs.publish_required == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      expected_code_revision: ${{ needs.sync.outputs.code_revision }}
      expected_data_revision: ${{ needs.sync.outputs.data_revision }}

  report:
    needs:
      - sync
      - publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out release verifier and application configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.code_revision || 'main' }}

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install release-verifier dependencies
        run: npm ci --ignore-scripts

      - name: Prove the expected release is live
        id: live
        env:
          DASHBOARD_PUBLIC_URL: ${{ vars.DASHBOARD_PUBLIC_URL }}
          EXPECTED_CODE_REVISION: ${{ needs.sync.outputs.code_revision }}
          EXPECTED_CONTENT_HASH: ${{ needs.sync.outputs.content_hash }}
          EXPECTED_DATA_REVISION: ${{ needs.sync.outputs.data_revision }}
          PUBLISH_REQUIRED: ${{ needs.sync.outputs.publish_required }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          release_base_url="${DASHBOARD_PUBLIC_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}}"
          release_url="${release_base_url%/}/release.json?expected_data_revision=${EXPECTED_DATA_REVISION}&run_id=${GITHUB_RUN_ID}&attempt=${GITHUB_RUN_ATTEMPT}"
          live_manifest="$(mktemp)"
          trap 'rm -f "$live_manifest"' EXIT
          max_attempts=1
          live_matches=false

          if [[ "$PUBLISH_REQUIRED" == "true" && "$PUBLISH_RESULT" == "success" ]]; then
            max_attempts=6
          fi

          for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --proto '=https' \
              --connect-timeout 5 \
              --max-time 20 \
              --max-filesize 65536 \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              --output "$live_manifest" \
              "$release_url" &&
              npx --no-install tsx scripts/release-manifest.ts matches \
                "$live_manifest" \
                "$EXPECTED_CODE_REVISION" \
                "$EXPECTED_DATA_REVISION" \
                "$EXPECTED_CONTENT_HASH"
            then
              live_matches=true
              break
            fi
            if (( attempt < max_attempts )); then
              sleep 5
            fi
          done

          echo "matches=$live_matches" >> "$GITHUB_OUTPUT"

      - name: Open, update, or close the sanitized sync issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LIVE_RELEASE_MATCHES: ${{ steps.live.outputs.matches }}
          SYNC_RESULT: ${{ needs.sync.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_REQUIRED: ${{ needs.sync.outputs.publish_required }}
        with:
          script: |
            const fs = require("fs");
            const config = JSON.parse(
              fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/config/team.json`, "utf8")
            );
            const title = `${config.teamName} sync failing`;
            const syncFailed = process.env.SYNC_RESULT !== "success";
            const publishRequired = process.env.PUBLISH_REQUIRED === "true";
            const publishResult = process.env.PUBLISH_RESULT;
            const liveReleaseMatches = process.env.LIVE_RELEASE_MATCHES === "true";
            const publishFailed =
              (publishRequired
                ? publishResult !== "success"
                : !["success", "skipped"].includes(publishResult)) ||
              !liveReleaseMatches;
            const failed = syncFailed || publishFailed;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (failed) {
              const body = [
                `The automated ${config.teamName} source check or exact-artifact publish gate failed.`,
                "",
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "The public dashboard remains on the previous validated snapshot.",
              ].join("\n");
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
